schema_version: 1
id: image-demo
name: 单镜像示例
description: 使用固定摘要的 Caddy 镜像。
version: 1.0.0
kind: image
path: /image-demo/
startup: manual
visibility: public
route_mode: strip_prefix
source:
  image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
  container_port: 80
health:
  path: /
  interval_seconds: 15
  timeout_seconds: 5
lifecycle:
  allow: [start, stop, restart]
backup:
  mode: none
